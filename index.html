<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>你好，我是 <span class="highlight">王旭</span></h1>
        <p class="subtitle">一个热爱创造的前端学习者</p>
        <p class="tagline">用代码把想法变成现实</p>
        <a href="#about" class="btn">了解更多</a>
      </div>
    </div>
  </header>

  <section id="about" class="section">
    <div class="container">
      <h2>关于我</h2>
      <div class="about-grid">
        <div class="about-text">
          <p>我是一名编程爱好者，正在学习如何构建好看又好用的网站。</p>
          <p>这个网站是我从零开始创建的第一个线上项目——它见证了我的第一步。</p>
        </div>
        <div class="about-skills">
          <h3>正在学习</h3>
          <ul>
            <li>HTML &amp; CSS</li>
            <li>JavaScript</li>
            <li>Git &amp; GitHub</li>
            <li>网页设计与部署</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section id="projects" class="section bg-alt">
    <div class="container">
      <h2>我的项目</h2>
      <div class="project-card">
        <h3>个人主页</h3>
        <p>这就是你现在看到的网站——我亲手写的第一行代码，第一次部署到互联网。</p>
        <span class="tag">HTML</span>
        <span class="tag">CSS</span>
        <span class="tag">GitHub Pages</span>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 王旭 | 用 ❤️ 和 Codex 制作</p>
    </div>
  </footer>

</body>
</html>
